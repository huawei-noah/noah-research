[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name    = "deepcraft-core"
version = "0.2.0"

readme  = "README.md"
authors = [
    { name = "Mingming Zhao", email = "zhaomingming9@huawei.com" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "openai",
    "tiktoken",
    "litellm",
    "pydantic>=2.10.4",
    "tenacity>=9.0.0",
    "mcp[cli]>=1.3.0",
    "sentence-transformers>=4.0.2",
    "langchain_community",
    "chromadb",
    "rank_bm25",
    "jieba",
    "nltk",
    "lazy_loader",
    "langchain_openai",
]

