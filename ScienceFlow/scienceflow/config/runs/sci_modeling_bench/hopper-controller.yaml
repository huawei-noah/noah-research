max_concurrent: 1
time_limit: 7800
resume: false

lnr:
  max_steps: 500
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/config/sci_modeling_bench.yaml
  phase: run
  type: lnr
  workspace_base: workspaces/sci_modeling_bench_2h
  tool:
    scienceflow_bash_timeout_sec: 600
    scienceflow_bash_timeout_slow_sec: 600
  evaluator:
    enabled: true
    backend: task_package

tasks:
  - exp_id: sci-modeling-bench-hopper-controller
    run_id: sci-modeling-bench-hopper-controller-v010-w2-2h
    input_data_dir: cache/sci_modeling_bench/hopper-controller/public
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 7200
      num_workers: 2
      omp_threads_cap: 4
      resource_gpu_pool: []
      seed: 2222
