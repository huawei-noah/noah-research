# Prepare with tasks/sci_modeling_bench/_shared/prepare_data.py --task-id
# sci-modeling-bench-tfbind8 before running this example.

max_concurrent: 1
time_limit: 1800
resume: false

lnr:
  max_steps: 300
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/config/sci_modeling_bench.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/manual_sci_modeling_bench_examples
  tool:
    scienceflow_bash_timeout_sec: 600
    scienceflow_bash_timeout_slow_sec: 600
  evaluator:
    enabled: true
    backend: task_package

tasks:
  - exp_id: sci-modeling-bench-tfbind8
    run_id: sci-modeling-bench-tfbind8-example
    input_data_dir: cache/sci_modeling_bench/tfbind8/public
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 1500
      num_workers: 2
      omp_threads_cap: 4
      resource_gpu_pool: []
      seed: 2222
