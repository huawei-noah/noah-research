# Install the task dependency once:
#   uv sync --extra scientific-design
#
# Prepare once:
#   uv run python \
#     tasks/sci_modeling_bench/tfbind8-black-box-v1/prepare_data.py
# Run:
#   uv run python -m scienceflow.cli parallel \
#     -m scienceflow/config/examples/tasks_sci_modeling_bench_tfbind8_example.yaml -j 1

max_concurrent: 1
time_limit: 1800
resume: false

lnr:
  max_steps: 300
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/config/default.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/manual_sci_modeling_bench_examples
  evaluator:
    enabled: true
    backend: task_package
  gate:
    params:
      minimum_metric_validity: high

tasks:
  - exp_id: sci-modeling-bench-tfbind8-v1
    run_id: sci-modeling-bench-tfbind8-smoke
    input_data_dir: cache/sci_modeling_bench/tfbind8-v1/public
    cpu_list: "48-55"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 1500
      num_workers: 1
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222
