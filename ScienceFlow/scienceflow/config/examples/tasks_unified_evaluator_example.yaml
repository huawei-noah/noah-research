# Unified evaluator example: MLEBench, optimization, and scientific design.
#
# Run all three sequentially from the repository root:
#   uv run python -m scienceflow.cli parallel \
#     -m scienceflow/config/examples/tasks_unified_evaluator_example.yaml -j 1
#
# The opt_solver fixture uses the tracked empty_input directory. Nomad2018 and
# TFBind8 need their prepared datasets.

max_concurrent: 1
time_limit: 3900
resume: false

lnr:
  max_steps: 500
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/config/default.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/manual_unified_evaluator_examples
  mlebench_data_root_dir: ./data/mlebench_all_data
  evaluator:
    enabled: true
    backend: task_package
  gate:
    params:
      minimum_metric_validity: high

tasks:
  - exp_id: nomad2018-predict-transparent-conductors
    run_id: unified-evaluator-nomad2018
    input_data_dir: ./data/mlebench_all_data/nomad2018-predict-transparent-conductors/prepared/dataset_split/Deep
    time_limit: 3900
    cpu_list: "48-63"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 3600
      num_workers: 2
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222

  - exp_id: ratio-minimization
    run_id: unified-evaluator-ratio-minimization
    input_data_dir: scienceflow/config/examples/empty_input
    time_limit: 1200
    cpu_list: "48-55"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 900
      num_workers: 1
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222

  - exp_id: sci-modeling-bench-tfbind8-v1
    run_id: unified-evaluator-sci-modeling-bench-tfbind8
    input_data_dir: cache/sci_modeling_bench/tfbind8-v1/public
    time_limit: 1800
    cpu_list: "48-55"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 1500
      num_workers: 1
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222
