# GPU queue, lease, pressure, sharing, and observer defaults.

lnr:
  resource_gpu_pool: []
  resource_gpu_default_request: 1
  resource_gpu_max_request: 1
  resource_gpu_assignment: lease
  resource_gpu_queue_max_wait_sec: 1800.0
  resource_gpu_queue_heartbeat_sec: 15.0
  resource_gpu_max_heavy_per_gpu: 1
  resource_gpu_capacity_slots: 1.0
  resource_gpu_tt_max_per_gpu: 3
  resource_gpu_feature_max_per_gpu: 2
  resource_gpu_share_tt_with_train: false
  resource_gpu_share_phase: observe
  resource_gpu_share_policy_profile: conservative
  resource_gpu_share_memory_profile: conservative
  resource_gpu_share_cpu_policy: conservative
  resource_gpu_trial_admission_policy: llm_grant
  resource_gpu_lease_ttl_sec: 7200.0
  resource_gpu_duplicate_digest_cooldown_sec: 600.0
  resource_gpu_duplicate_digest_threshold: 2
  resource_gpu_admission_waiter_ttl_sec: 900.0
  resource_admission_llm_mode: blocked_states
  resource_admission_llm_timeout_sec: 60.0
  resource_stale_pressure_observe_first_enabled: true
  resource_stale_pressure_observe_window_sec: 180.0
  resource_stale_pressure_observe_max_sec: 300.0
  resource_stale_pressure_observe_min_free_mem_gb: 8.0
  resource_stale_pressure_healthy_skip_llm: true
  resource_gpu_pressure_yellow_hold_sec: 120.0
  resource_gpu_pressure_red_to_yellow_sec: 120.0
  resource_gpu_pressure_yellow_util_pct: 85.0
  resource_gpu_pressure_min_free_mem_gb: 8.0
  resource_gpu_pressure_yellow_free_mem_buffer_gb: 8.0
  resource_observation_window_sec: 30.0
  resource_observation_shadow_workspace_enabled: true
  resource_gpu_source_hint_enabled: true
  resource_gpu_source_hint_mode: observe
  resource_gpu_util_observer_enabled: true
  resource_gpu_util_sample_interval_sec: 30.0
  resource_gpu_idle_lease_guard_enabled: true
  resource_gpu_idle_lease_warmup_sec: 180.0
  resource_gpu_idle_lease_min_samples: 3
  resource_gpu_idle_lease_util_pct: 1.0
  resource_gpu_idle_lease_mem_gb: 1.0
  resource_gpu_idle_lease_require_pressure: false
  resource_gpu_idle_lease_action_mode: release
  resource_idle_release_admission_mode: strict_exclusive
